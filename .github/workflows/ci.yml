name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Syntax check
        run: for f in js/*.js sw.js; do node --check "$f"; done
      - name: Install Playwright
        run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Smoke + logic tests
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 1
          node tests/smoke.cjs http://localhost:8765/
