name: keepalive
# Evita que el proyecto gratuito de Supabase se pause por inactividad (consulta ligera dos veces por semana).
on:
  schedule:
    - cron: "17 5 * * 1,4"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          KEY=$(grep -o 'key: "[^"]*' js/config.js | cut -d'"' -f2)
          URL=$(grep -o 'url: "[^"]*' js/config.js | cut -d'"' -f2)
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/profiles?select=id&limit=1" -H "apikey: $KEY")
          echo "HTTP $code"; test "$code" = "200"
